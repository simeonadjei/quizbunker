openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Exam Arena API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: questions
    description: Question bank
  - name: quiz
    description: Quiz sessions
  - name: songs
    description: Background music
  - name: payments
    description: Payments
  - name: admin
    description: Admin operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Resend email verification link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Questions ─────────────────────────────────────────────────────────────
  /questions:
    get:
      operationId: listQuestions
      tags: [questions]
      summary: List questions with filters
      parameters:
        - name: year
          in: query
          schema:
            type: string
        - name: subject
          in: query
          schema:
            type: string
        - name: week
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Question"

  /questions/filters:
    get:
      operationId: getQuestionFilters
      tags: [questions]
      summary: Get available years, subjects and weeks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionFilters"

  # ── Quiz ──────────────────────────────────────────────────────────────────
  /quiz/sessions:
    post:
      operationId: createQuizSession
      tags: [quiz]
      summary: Start a quiz session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizSessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSession"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /quiz/sessions/{sessionId}:
    get:
      operationId: getQuizSession
      tags: [quiz]
      summary: Get quiz session with results
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSessionDetail"

  /quiz/sessions/{sessionId}/submit:
    post:
      operationId: submitQuizSession
      tags: [quiz]
      summary: Submit quiz answers
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizSubmitInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSessionDetail"

  /quiz/history:
    get:
      operationId: getQuizHistory
      tags: [quiz]
      summary: Get user quiz history
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuizSession"

  # ── Songs ─────────────────────────────────────────────────────────────────
  /songs:
    get:
      operationId: listSongs
      tags: [songs]
      summary: List all active songs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Song"

  # ── Payments ──────────────────────────────────────────────────────────────
  /payments/submit:
    post:
      operationId: submitMomoPayment
      tags: [payments]
      summary: Submit a MoMo payment for manual verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MomoPaymentInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MomoPaymentResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/status:
    get:
      operationId: getPaymentStatus
      tags: [payments]
      summary: Get current user subscription status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"

  # ── Admin ─────────────────────────────────────────────────────────────────
  /admin/auth:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/questions/upload:
    post:
      operationId: uploadQuestions
      tags: [admin]
      summary: Bulk upload questions from file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/QuestionUploadInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /admin/questions/{id}:
    delete:
      operationId: deleteQuestion
      tags: [admin]
      summary: Delete a question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/songs:
    post:
      operationId: uploadSong
      tags: [admin]
      summary: Upload a song
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SongUploadInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"

  /admin/songs/{id}:
    put:
      operationId: updateSong
      tags: [admin]
      summary: Update song metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SongUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
    delete:
      operationId: deleteSong
      tags: [admin]
      summary: Delete a song
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/songs/reorder:
    put:
      operationId: reorderSongs
      tags: [admin]
      summary: Reorder songs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SongReorderInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAdmin"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin dashboard stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/activity:
    get:
      operationId: listAdminActivity
      tags: [admin]
      summary: Get site-wide activity log
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLog"

  /admin/payments:
    get:
      operationId: listAdminPayments
      tags: [admin]
      summary: Get all payment records
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPayment"

  /admin/payments/{id}/verify:
    post:
      operationId: verifyMomoPayment
      tags: [admin]
      summary: Admin verifies a pending MoMo payment by entering the txId they received
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MomoVerifyInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MomoVerifyResponse"
        "404":
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/subscribe:
    post:
      operationId: adminSubscribeUser
      tags: [admin]
      summary: Manually subscribe a user to any plan and optionally generate a password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSubscribeInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSubscribeResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # ── Auth ────────────────────────────────────────────────────────────────
    ResendVerificationInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        name:
          type: string
          minLength: 1

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        rememberMe:
          type: boolean

    User:
      type: object
      required: [id, email, name, subscriptionPlan]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        subscriptionPlan:
          type: string
          enum: [none, trial, monthly, semester, yearly]
        subscriptionEnd:
          type: ["string", "null"]
        semesterStart:
          type: ["string", "null"]

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 6

    # ── Questions ────────────────────────────────────────────────────────────
    Question:
      type: object
      required: [id, year, subject, week, weekTopic, questionNumber, questionText, optionA, optionB, optionC, optionD, correctAnswer]
      properties:
        id:
          type: integer
        year:
          type: string
        subject:
          type: string
        week:
          type: integer
        weekTopic:
          type: string
        questionNumber:
          type: integer
        questionText:
          type: string
        optionA:
          type: string
        optionB:
          type: string
        optionC:
          type: string
        optionD:
          type: string
        correctAnswer:
          type: string
        dok:
          type: ["string", "null"]
        learningIndicator:
          type: ["string", "null"]
        feedback:
          type: ["string", "null"]

    QuestionFilters:
      type: object
      required: [years, subjects, weeks]
      properties:
        years:
          type: array
          items:
            type: string
        subjects:
          type: array
          items:
            type: string
        weeks:
          type: array
          items:
            type: integer

    # ── Quiz ─────────────────────────────────────────────────────────────────
    QuizSessionInput:
      type: object
      required: [year, subject, week]
      properties:
        year:
          type: string
        subject:
          type: string
        week:
          type: integer

    QuizSession:
      type: object
      required: [id, year, subject, week, totalQuestions, completedAt]
      properties:
        id:
          type: integer
        year:
          type: string
        subject:
          type: string
        week:
          type: integer
        weekTopic:
          type: ["string", "null"]
        score:
          type: ["integer", "null"]
        totalQuestions:
          type: integer
        completedAt:
          type: ["string", "null"]

    QuizSessionDetail:
      type: object
      required: [id, year, subject, week, questions, answers]
      properties:
        id:
          type: integer
        year:
          type: string
        subject:
          type: string
        week:
          type: integer
        weekTopic:
          type: ["string", "null"]
        score:
          type: ["integer", "null"]
        totalQuestions:
          type: integer
        completedAt:
          type: ["string", "null"]
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        answers:
          type: array
          items:
            $ref: "#/components/schemas/QuizAnswer"

    QuizAnswer:
      type: object
      required: [questionId, isCorrect]
      properties:
        questionId:
          type: integer
        selectedAnswer:
          type: ["string", "null"]
        isCorrect:
          type: boolean

    QuizSubmitInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AnswerInput"

    AnswerInput:
      type: object
      required: [questionId, selectedAnswer]
      properties:
        questionId:
          type: integer
        selectedAnswer:
          type: string

    # ── Songs ─────────────────────────────────────────────────────────────────
    Song:
      type: object
      required: [id, title, url, sortOrder, isActive]
      properties:
        id:
          type: integer
        title:
          type: string
        url:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean

    SongUploadInput:
      type: object
      required: [title]
      properties:
        title:
          type: string

    SongUpdate:
      type: object
      properties:
        title:
          type: string
        isActive:
          type: boolean
        sortOrder:
          type: integer

    SongReorderInput:
      type: object
      required: [songIds]
      properties:
        songIds:
          type: array
          items:
            type: integer

    # ── Payments ──────────────────────────────────────────────────────────────
    MomoPaymentInput:
      type: object
      required: [plan, txId]
      properties:
        plan:
          type: string
          enum: [monthly, semester, yearly]
        txId:
          type: string
          minLength: 1
        semesterStart:
          type: ["string", "null"]

    MomoPaymentResponse:
      type: object
      required: [message, reference]
      properties:
        message:
          type: string
        reference:
          type: string

    SubscriptionStatus:
      type: object
      required: [plan, isActive]
      properties:
        plan:
          type: string
        isActive:
          type: boolean
        subscriptionEnd:
          type: ["string", "null"]
        daysRemaining:
          type: ["integer", "null"]

    # ── Admin ─────────────────────────────────────────────────────────────────
    AdminLoginInput:
      type: object
      required: [password]
      properties:
        email:
          type: string
        password:
          type: string

    QuestionUploadInput:
      type: object
      properties:
        year:
          type: string
        subject:
          type: string

    UploadResult:
      type: object
      required: [inserted, skipped]
      properties:
        inserted:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: string
        preview:
          type: array
          items:
            $ref: "#/components/schemas/Question"

    UserAdmin:
      type: object
      required: [id, email, name, subscriptionPlan, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        subscriptionPlan:
          type: string
        subscriptionEnd:
          type: ["string", "null"]
        createdAt:
          type: string

    AdminStats:
      type: object
      required: [totalUsers, activeSubscribers, totalQuestions, totalSubjects, totalSongs, recentSessions]
      properties:
        totalUsers:
          type: integer
        activeSubscribers:
          type: integer
        totalQuestions:
          type: integer
        totalSubjects:
          type: integer
        totalSongs:
          type: integer
        recentSessions:
          type: integer

    ActivityLog:
      type: object
      required: [id, type, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
        userId:
          type: ["integer", "null"]
        userEmail:
          type: ["string", "null"]
        userName:
          type: ["string", "null"]
        metadata:
          type: ["string", "null"]
        ip:
          type: ["string", "null"]
        createdAt:
          type: string

    AdminPayment:
      type: object
      required: [id, userId, plan, amount, status, reference, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        userEmail:
          type: ["string", "null"]
        userName:
          type: ["string", "null"]
        plan:
          type: string
        amount:
          type: integer
        status:
          type: string
        reference:
          type: string
        userTxId:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        createdAt:
          type: string

    MomoVerifyInput:
      type: object
      required: [txId]
      properties:
        txId:
          type: string
          minLength: 1

    MomoVerifyResponse:
      type: object
      required: [match, message]
      properties:
        match:
          type: boolean
        message:
          type: string

    AdminSubscribeInput:
      type: object
      required: [email, plan]
      properties:
        email:
          type: string
        plan:
          type: string
          enum: [trial, monthly, semester, yearly]
        months:
          type: integer
        generatePassword:
          type: boolean

    AdminSubscribeResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        generatedPassword:
          type: ["string", "null"]
