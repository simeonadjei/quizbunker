<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Quiz Bunker</title>
    <meta name="description" content="Quiz Bunker — Ghana's top exam practice platform. 1,500+ past questions, Dok 1 to 4, organised by subject and week." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Quiz Bunker" />
    <meta property="og:description" content="Ghana's top exam practice platform. 1,500+ past questions, Dok 1 to 4." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quiz Bunker" />
    <meta name="twitter:description" content="Ghana's top exam practice platform. 1,500+ past questions, Dok 1 to 4." />
    <!-- Preload logo so it is in cache before anything else renders -->
    <link rel="preload" as="image" href="%BASE_URL%logo.png" />
    <link rel="icon" type="image/png" href="%BASE_URL%logo.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fredoka One for the main title, Playfair Display for the quote -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">

    <style>
      /* ── Splash reset ────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: hsl(240, 35%, 11%); }

      /* ── Splash wrapper ──────────────────────────────────────────── */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: hsl(240, 35%, 11%);
        gap: 20px;
        transition: opacity 1s ease-in-out;
      }

      /* ── Ring container ──────────────────────────────────────────── */
      .splash-ring-wrap {
        position: relative;
        width: 200px;
        height: 200px;
        flex-shrink: 0;
      }

      /* spinning SVG ring */
      .splash-ring {
        position: absolute;
        inset: 0;
        width: 200px;
        height: 200px;
        animation: spinRing 2.4s linear infinite;
      }

      /* glow behind logo */
      .splash-glow {
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        box-shadow: 0 0 40px 8px rgba(255, 165, 0, 0.35);
      }

      /* logo circle */
      .splash-logo {
        position: absolute;
        inset: 14px;
        width: calc(100% - 28px);
        height: calc(100% - 28px);
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid rgba(255, 165, 0, 0.5);
        display: block;
      }

      /* ── Main title (Quiz Bunker) ────────────────────────────────── */
      .splash-title {
        display: flex;
        gap: 3px;
        font-family: 'Fredoka One', cursive;
        font-size: clamp(36px, 9vw, 58px);
        letter-spacing: 3px;
        min-height: 66px;
        align-items: center;
        filter: drop-shadow(0 6px 18px rgba(0,0,0,0.7));
      }

      .splash-letter {
        display: inline-block;
        opacity: 0;
        transform: translateY(18px) scale(0.7);
        animation: letterIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      /* ── Quote "Practice Makes Man Perfect" ─────────────────────── */
      .splash-quote-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        min-height: 60px;
      }

      /* Two lines: line 1 = "Practice Makes", line 2 = "Man Perfect" */
      .splash-quote-line {
        display: flex;
        gap: 1px;
        align-items: baseline;
        font-family: 'Playfair Display', Georgia, serif;
        font-style: italic;
        font-size: clamp(15px, 3.2vw, 22px);
        letter-spacing: 1.5px;
        min-height: 28px;
      }

      .quote-space {
        display: inline-block;
        width: 10px;
      }

      .splash-qletter {
        display: inline-block;
        opacity: 0;
        transform: translateY(10px) rotate(-2deg);
        animation: quoteLetterIn 0.2s ease forwards;
      }

      /* Attribution line */
      .splash-attribution {
        font-family: 'Playfair Display', Georgia, serif;
        font-style: italic;
        font-size: clamp(11px, 2vw, 14px);
        letter-spacing: 2px;
        color: hsl(45, 100%, 72%);
        text-shadow: 0 0 12px hsl(45, 100%, 60% / 0.7), 0 0 24px hsl(45, 100%, 55% / 0.35);
        opacity: 0;
        transition: opacity 0.6s ease;
        text-align: center;
      }
      .splash-attribution.visible { opacity: 1; }

      /* ── Hype word roller ────────────────────────────────────────── */
      .splash-hype-wrap {
        height: 34px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .splash-hype {
        font-family: 'Fredoka One', cursive;
        font-size: clamp(20px, 5vw, 30px);
        letter-spacing: 5px;
        text-transform: uppercase;
        color: #FFD030;
        text-shadow: 0 0 16px #FFD030, 0 0 32px #FF9000CC, 0 0 56px #FF500088;
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.35s ease, transform 0.35s ease;
      }

      .splash-hype.visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* ── Dots ────────────────────────────────────────────────────── */
      .splash-dots {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .splash-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: linear-gradient(135deg, #FFD700, #FF8E53);
        box-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
        animation: dotBounce 1.2s ease-in-out infinite;
      }

      /* ── Keyframes ───────────────────────────────────────────────── */
      @keyframes spinRing {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      @keyframes letterIn {
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes quoteLetterIn {
        to { opacity: 1; transform: translateY(0) rotate(0deg); }
      }

      @keyframes dotBounce {
        0%, 80%, 100% { transform: translateY(0);     opacity: 0.4; }
        40%            { transform: translateY(-10px); opacity: 1;   }
      }
    </style>
  </head>
  <body>

    <!-- ════ SPLASH (pure HTML — visible from first paint) ════ -->
    <div id="splash">

      <div class="splash-ring-wrap">
        <!-- Spinning gold arc -->
        <svg class="splash-ring" viewBox="0 0 200 200">
          <defs>
            <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%"   stop-color="#FFD700" stop-opacity="1"/>
              <stop offset="40%"  stop-color="#FF8E53" stop-opacity="0.9"/>
              <stop offset="100%" stop-color="#FFD700" stop-opacity="0.05"/>
            </linearGradient>
          </defs>
          <circle cx="100" cy="100" r="92"
            fill="none" stroke="url(#rg)" stroke-width="6"
            stroke-linecap="round" stroke-dasharray="180 410"/>
        </svg>

        <div class="splash-glow"></div>

        <img class="splash-logo"
             src="%BASE_URL%logo.png"
             decoding="sync"
             alt="Quiz Bunker" />
      </div>

      <!-- Letter-by-letter "Quiz Bunker" -->
      <div class="splash-title">
        <span class="splash-letter" style="color:#FFE840;text-shadow:0 0 14px #FFE840,0 0 30px #FFD700CC,0 0 55px #FFB800AA;animation-delay:0.10s">Q</span>
        <span class="splash-letter" style="color:#FF7070;text-shadow:0 0 14px #FF7070,0 0 30px #FF4444CC,0 0 55px #FF2200AA;animation-delay:0.22s">u</span>
        <span class="splash-letter" style="color:#40F0E8;text-shadow:0 0 14px #40F0E8,0 0 30px #00DEDACC,0 0 55px #00C8C4AA;animation-delay:0.34s">i</span>
        <span class="splash-letter" style="color:#B8FF50;text-shadow:0 0 14px #B8FF50,0 0 30px #96EE00CC,0 0 55px #78DD00AA;animation-delay:0.46s">z</span>
        <span style="display:inline-block;width:18px"></span>
        <span class="splash-letter" style="color:#D878FF;text-shadow:0 0 14px #D878FF,0 0 30px #C050FFCC,0 0 55px #AA00FFAA;animation-delay:0.70s">B</span>
        <span class="splash-letter" style="color:#20D8FF;text-shadow:0 0 14px #20D8FF,0 0 30px #00BBFFCC,0 0 55px #0090FFAA;animation-delay:0.82s">u</span>
        <span class="splash-letter" style="color:#FF5560;text-shadow:0 0 14px #FF5560,0 0 30px #FF2233CC,0 0 55px #EE0020AA;animation-delay:0.94s">n</span>
        <span class="splash-letter" style="color:#50FF90;text-shadow:0 0 14px #50FF90,0 0 30px #22EE60CC,0 0 55px #00DD40AA;animation-delay:1.06s">k</span>
        <span class="splash-letter" style="color:#FF78AA;text-shadow:0 0 14px #FF78AA,0 0 30px #FF4488CC,0 0 55px #FF1166AA;animation-delay:1.18s">e</span>
        <span class="splash-letter" style="color:#FFE840;text-shadow:0 0 14px #FFE840,0 0 30px #FFD700CC,0 0 55px #FFB800AA;animation-delay:1.30s">r</span>
      </div>

      <!-- Quote: "Practice Makes Man Perfect" — letter by letter, two lines -->
      <div class="splash-quote-wrap">

        <!-- Line 1: Practice Makes -->
        <div class="splash-quote-line">
          <!-- "Practice" in vivid violet-to-cyan gradient -->
          <span class="splash-qletter" style="color:#E040FB;text-shadow:0 0 14px #E040FBCC,0 0 28px #E040FB55;animation-delay:1.55s">P</span>
          <span class="splash-qletter" style="color:#CE3AF7;text-shadow:0 0 14px #CE3AF7CC,0 0 28px #CE3AF755;animation-delay:1.65s">r</span>
          <span class="splash-qletter" style="color:#BA35F3;text-shadow:0 0 14px #BA35F3CC,0 0 28px #BA35F355;animation-delay:1.75s">a</span>
          <span class="splash-qletter" style="color:#A030EF;text-shadow:0 0 14px #A030EFCC,0 0 28px #A030EF55;animation-delay:1.85s">c</span>
          <span class="splash-qletter" style="color:#8B2DEB;text-shadow:0 0 14px #8B2DEBCC,0 0 28px #8B2DEB55;animation-delay:1.95s">t</span>
          <span class="splash-qletter" style="color:#A030EF;text-shadow:0 0 14px #A030EFCC,0 0 28px #A030EF55;animation-delay:2.05s">i</span>
          <span class="splash-qletter" style="color:#BA35F3;text-shadow:0 0 14px #BA35F3CC,0 0 28px #BA35F355;animation-delay:2.15s">c</span>
          <span class="splash-qletter" style="color:#CE3AF7;text-shadow:0 0 14px #CE3AF7CC,0 0 28px #CE3AF755;animation-delay:2.25s">e</span>
          <!-- space -->
          <span class="quote-space"></span>
          <!-- "Makes" in blazing gold -->
          <span class="splash-qletter" style="color:#FFD700;text-shadow:0 0 14px #FFD700CC,0 0 28px #FFD70055;animation-delay:2.45s">M</span>
          <span class="splash-qletter" style="color:#FFC200;text-shadow:0 0 14px #FFC200CC,0 0 28px #FFC20055;animation-delay:2.55s">a</span>
          <span class="splash-qletter" style="color:#FFAD00;text-shadow:0 0 14px #FFAD00CC,0 0 28px #FFAD0055;animation-delay:2.65s">k</span>
          <span class="splash-qletter" style="color:#FF9800;text-shadow:0 0 14px #FF9800CC,0 0 28px #FF980055;animation-delay:2.75s">e</span>
          <span class="splash-qletter" style="color:#FF8500;text-shadow:0 0 14px #FF8500CC,0 0 28px #FF850055;animation-delay:2.85s">s</span>
        </div>

        <!-- Line 2: Man Perfect -->
        <div class="splash-quote-line">
          <!-- "Man" in electric cyan -->
          <span class="splash-qletter" style="color:#00E5FF;text-shadow:0 0 14px #00E5FFCC,0 0 28px #00E5FF55;animation-delay:3.05s">M</span>
          <span class="splash-qletter" style="color:#00D4F5;text-shadow:0 0 14px #00D4F5CC,0 0 28px #00D4F555;animation-delay:3.15s">a</span>
          <span class="splash-qletter" style="color:#00C2E0;text-shadow:0 0 14px #00C2E0CC,0 0 28px #00C2E055;animation-delay:3.25s">n</span>
          <!-- space -->
          <span class="quote-space"></span>
          <!-- "Perfect" in hot coral-to-rose -->
          <span class="splash-qletter" style="color:#FF4081;text-shadow:0 0 14px #FF4081CC,0 0 28px #FF408155;animation-delay:3.45s">P</span>
          <span class="splash-qletter" style="color:#FF2060;text-shadow:0 0 14px #FF2060CC,0 0 28px #FF206055;animation-delay:3.55s">e</span>
          <span class="splash-qletter" style="color:#FF0040;text-shadow:0 0 14px #FF0040CC,0 0 28px #FF004055;animation-delay:3.65s">r</span>
          <span class="splash-qletter" style="color:#FF2060;text-shadow:0 0 14px #FF2060CC,0 0 28px #FF206055;animation-delay:3.75s">f</span>
          <span class="splash-qletter" style="color:#FF4081;text-shadow:0 0 14px #FF4081CC,0 0 28px #FF408155;animation-delay:3.85s">e</span>
          <span class="splash-qletter" style="color:#FF6699;text-shadow:0 0 14px #FF6699CC,0 0 28px #FF669955;animation-delay:3.95s">c</span>
          <span class="splash-qletter" style="color:#FF88AA;text-shadow:0 0 14px #FF88AACC,0 0 28px #FF88AA55;animation-delay:4.05s">t</span>
        </div>

        <!-- Attribution -->
        <div class="splash-attribution" id="splash-attr">— Ancient Proverb</div>
      </div>

      <!-- Rolling hype words -->
      <div class="splash-hype-wrap">
        <span class="splash-hype" id="splash-hype"></span>
      </div>

      <!-- Three bouncing golden dots -->
      <div class="splash-dots">
        <div class="splash-dot" style="animation-delay:0s"></div>
        <div class="splash-dot" style="animation-delay:0.2s"></div>
        <div class="splash-dot" style="animation-delay:0.4s"></div>
      </div>
    </div>
    <!-- ════ END SPLASH ════ -->

    <div id="root"></div>

    <script>
      (function () {
        // Show attribution after quote letters finish
        var attr = document.getElementById('splash-attr');
        setTimeout(function () { attr.classList.add('visible'); }, 4400);

        // Hype words — start after attribution settles
        var words = ['DOMINATE', 'CONQUER', 'MASTER IT', 'ACE IT', 'LEVEL UP', 'CRUSH IT', 'RISE UP', 'WIN BIG', 'PROVE IT'];
        var el = document.getElementById('splash-hype');
        var idx = 0;

        function showWord() {
          el.textContent = words[idx % words.length];
          el.classList.add('visible');
          idx++;
          setTimeout(function () {
            el.classList.remove('visible');
            setTimeout(showWord, 450);
          }, 1600);
        }

        setTimeout(showWord, 5000);

        // Fade out and remove splash after 5 seconds
        var splash = document.getElementById('splash');
        setTimeout(function () {
          splash.style.opacity = '0';
          splash.style.pointerEvents = 'none';
          setTimeout(function () { splash.remove(); }, 1000);
        }, 5000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
